<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nowave — a calmer place for your inbox</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eeeff2; color: #25262b; font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    button { font: inherit; cursor: pointer; }
    .studio { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; min-height: 76px; padding: 16px 28px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; font-weight: 650; font-size: 17px; letter-spacing: -.6px; }
    .mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: #282a30; color: #fff; font-size: 20px; }
    .brand span:last-child { margin-left: 6px; color: #8b8d96; font-weight: 400; font-size: 12px; letter-spacing: 0; }
    .segment { display: flex; padding: 3px; border: 1px solid #dfe0e5; border-radius: 9px; gap: 2px; }
    button { border: 0; background: transparent; color: #70727c; border-radius: 6px; padding: 7px 12px; white-space: nowrap; }
    button:hover { color: #24262c; background: #ffffff80; }
    button[aria-pressed="true"] { background: #fff; color: #292b31; box-shadow: 0 1px 4px #1b1d2512; }
    button:focus-visible { outline: 2px solid #3d63f2; outline-offset: 2px; }
    .views { display: flex; flex-wrap: wrap; gap: 2px; }
    .views button { padding-inline: 9px; }
    .views button[aria-pressed="true"] { background: #e2e5ed; box-shadow: none; }
    main { margin: 0 20px; border: 1px solid #d9dbe2; border-radius: 14px; box-shadow: 0 8px 28px #1d20300a; overflow: hidden; background: white; }
    iframe { display: block; border: 0; width: 100%; height: calc(100vh - 126px); min-height: 480px; background: #f6f8fc; }
    footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; padding: 14px 28px; font-size: 11px; color: #777b87; }
    footer span:first-child::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #778d7d; margin-right: 7px; }
    kbd { font: inherit; background: #e5e7ec; border: 1px solid #d5d8df; border-radius: 3px; padding: 1px 4px; }
    @media(max-width: 900px) { .studio { gap: 10px; padding: 12px 16px; } .brand span:last-child { display: none; } .views { width: 100%; } main { margin-inline: 8px; } iframe { height: calc(100vh - 162px); } footer { padding-inline: 16px; } }
  </style>
</head>
<body>
  <header class="studio">
    <div class="brand"><span class="mark">≈</span>nowave<span>DESIGN PREVIEW</span></div>
    <div class="segment" role="group" aria-label="Appearance">
      <button data-skin="native" aria-pressed="false">Gmail-style baseline</button>
      <button data-skin="nowave" aria-pressed="true">With Nowave</button>
    </div>
    <nav class="views" aria-label="Preview surface">
      <button data-view="inbox" aria-pressed="true">Inbox</button>
      <button data-view="reading" aria-pressed="false">Reading pane</button>
      <button data-view="thread" aria-pressed="false">Thread</button>
      <button data-view="compose" aria-pressed="false">Compose</button>
      <button data-view="palette" aria-pressed="false">⌘K Palette</button>
    </nav>
  </header>
  <main><iframe title="Interactive Gmail-style mock with the actual Nowave userscript" src="/dev/fixture.html?preview=1&amp;skin=nowave"></iframe></main>
  <footer><span>Actual userscript. Synthetic mail. No account connected.</span><span>Click a conversation to open it · <kbd>Ctrl</kbd> / <kbd>⌘</kbd> + <kbd>K</kbd> for commands</span></footer>
  <script type="module">
    const frame = document.querySelector('iframe');
    let skin = 'nowave';
    let view = 'inbox';
    function show() {
      frame.contentWindow.postMessage({ type: 'nowave-demo', view }, location.origin);
    }
    frame.addEventListener('load', show);
    for (const button of document.querySelectorAll('[data-skin]')) button.onclick = () => {
      skin = button.dataset.skin;
      for (const item of document.querySelectorAll('[data-skin]')) item.setAttribute('aria-pressed', String(item === button));
      frame.src = `/dev/fixture.html?preview=1&skin=${skin}`;
    };
    for (const button of document.querySelectorAll('[data-view]')) button.onclick = () => {
      view = button.dataset.view;
      for (const item of document.querySelectorAll('[data-view]')) item.setAttribute('aria-pressed', String(item === button));
      show();
    };
  </script>
</body>
</html>
